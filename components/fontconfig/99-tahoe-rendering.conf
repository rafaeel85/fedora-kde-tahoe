<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- macOS-like text rendering: grayscale antialiasing (no colour fringes), light hinting -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>
  <!-- prefer Inter wherever apps ask for the Apple system fonts -->
  <alias binding="same"><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Text</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Display</family><prefer><family>Inter Display</family></prefer></alias>
  <alias binding="same"><family>SF Pro</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Mono</family><prefer><family>Hack</family></prefer></alias>
  <alias binding="same"><family>Menlo</family><prefer><family>Hack</family></prefer></alias>
  <alias binding="same"><family>ui-monospace</family><prefer><family>Hack</family></prefer></alias>
  <!-- 2026-11-26: generic families (used by browsers, GTK, Flatpak, most apps) -> Tahoe stand-ins -->
  <alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>ui-sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Hack</family></prefer></alias>
  <alias binding="same"><family>.AppleSystemUIFont</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>San Francisco</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Lucida Grande</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Noto Sans</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Cantarell</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>DejaVu Sans</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Monaco</family><prefer><family>Hack</family></prefer></alias>
  <alias binding="same"><family>DejaVu Sans Mono</family><prefer><family>Hack</family></prefer></alias>
  <alias binding="same"><family>Noto Sans Mono</family><prefer><family>Hack</family></prefer></alias>
</fontconfig>
